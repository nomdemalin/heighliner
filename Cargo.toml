[package]
name = "heighliner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Watch directories, move files by declarative rules into hot/warm/cold/frozen tiers."
authors = ["Rémy Delorme"]
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "heighliner"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
egui_plot = "0.29"

# Filesystem / watching
notify = "6"
notify-debouncer-full = "0.3"
walkdir = "2"
globset = "0.4"
same-file = "1"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# System dirs / dialogs
dirs = "5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# Logging / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

# Time / sizes
chrono = { version = "0.4", features = ["serde"] }
humansize = "2"
humantime = "2"
humantime-serde = "1"

# Util
parking_lot = "0.12"
crossbeam-channel = "0.5"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# rfd native dialogs on mac
rfd = { version = "0.15", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1  # otherwise egui/skia-ish rendering crawls

[package.metadata.bundle]
name = "Heighliner"
identifier = "io.github.nomdemalin.heighliner"
category = "public.app-category.utilities"
short_description = "Keep your home directory in order."
long_description = """
Heighliner watches directories you choose and shuffles files into
hot/warm/cold/frozen tiers based on when you last touched them,
according to declarative rules. Includes space-usage breakdowns and
periodic archive/purge sweeps.
"""
copyright = "Copyright (c) 2026 Rémy Delorme"
osx_minimum_system_version = "11.0"
icon = ["assets/Heighliner.icns"]
